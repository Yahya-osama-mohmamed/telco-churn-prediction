[project]
name = "telco-churn-prediction"
version = "1.0.0"
description = "Churn prediction with a leakage-safe pipeline, a tuned decision threshold, and a served API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# xgboost, lightgbm and shap are dev-only here: the champion is a
# logistic regression, so the served image does not need them.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "joblib==1.6.0",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "xgboost==2.1.4",
    "lightgbm==4.7.0",
    "shap==0.51.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "plotly==7.1.0",
    "streamlit==1.65.0",
    "mlflow==3.16.1",
    "requests==2.34.2",
    "openpyxl==3.1.5",
    "ipykernel==7.4.0",
    "nbconvert==7.17.1",
    "pytest==9.1.1",
    "pytest-cov>=6",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[tool.ruff]
# Notebooks are deliberately excluded: `import a; import b` on one line and
# imports part-way down a file are normal notebook style, and enforcing library
# rules on exploratory cells produces noise rather than quality.
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "venv", "mlruns", "dashboard", "data", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008 is the FastAPI dependency-injection idiom (Depends(), File()), not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# The project is not installed as a package, so make the root importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# These are applications, not libraries: install the dependencies, not the project.
package = false
